# Render blueprint — deploy the API with `render.yaml` from the Render dashboard
# ("New +" → "Blueprint" → point at this repo).
#
# Alternative manual setup: create a "Web Service" pointing at the /server folder,
# build: npm install, start: npm start, and paste the env vars from .env.example.
services:
  - type: web
    name: ai-chart-scanner-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in Render dashboard (MongoDB Atlas connection string)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # your Vercel URL, e.g. https://your-app.vercel.app
      # AI providers — at least one for real analyses (fallback = mock)
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # NVIDIA AI — open-source vision/text models (optional; editable from admin)
      - key: NVIDIA_API_KEY
        sync: false
      # Computer Vision engine provider (defaults to AI_PROVIDER when unset)
      - key: VISION_PROVIDER
        value: openai
      # Encryption key for admin-managed API keys stored in the DB.
      # MUST be a stable 32-byte secret. Generate: openssl rand -hex 16
      - key: SETTINGS_ENC_KEY
        sync: false
      # Media storage
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Market data (optional — crypto works via Binance without a key)
      - key: TWELVEDATA_API_KEY
        sync: false
      # SebPay (optional — without it, payments run in demo mode)
      - key: SEBPAY_PUBLIC_KEY
        sync: false
      - key: SEBPAY_SECRET_KEY
        sync: false
      - key: SEBPAY_CALLBACK_URL
        sync: false
      # Email (optional — without it, verification emails print to the console)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Require a verified email before scanning / multi-timeframe / trade validator.
      # Emails are configured above, so keep this ON in production.
      # Require a verified email before scanning. Default OFF — this is a
      # bootstrap fallback only; the effective value is controlled at runtime
      # from the admin dashboard (Fonctionnalités → Vérification email).
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      # Resend HTTP API — reliable email on hosts that block outbound SMTP
      # (Render). Set the key from resend.com; without it, falls back to SMTP.
      - key: RESEND_API_KEY
        sync: false
      # Admin bootstrap
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
